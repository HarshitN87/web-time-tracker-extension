<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flow Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">

    <header class="masthead">
      <svg class="enso" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="41" fill="none" stroke="currentColor" stroke-width="7"
                stroke-linecap="round" stroke-dasharray="222 36" transform="rotate(-38 50 50)"/>
      </svg>
      <span class="wordmark">Flow Tracker</span>
    </header>

    <section class="now" id="now" aria-live="polite">
      <div class="now-empty">Reading current tab…</div>
    </section>

    <section class="tagger" id="tagger" hidden>
      <div class="eyebrow">Count this visit as</div>
      <div class="segmented" id="segmented" role="group" aria-label="Tag the current visit">
        <button type="button" class="seg" data-label="productive">Productive</button>
        <button type="button" class="seg" data-label="neutral">Neutral</button>
        <button type="button" class="seg" data-label="distracting">Distracting</button>
      </div>
      <button type="button" class="always" id="always" hidden></button>
      <p class="note" id="note"></p>
    </section>

    <!-- Live controls belong next to each other. The focus timer used to be
         three clicks deep in a dashboard tab. -->
    <section class="focus" id="focus" hidden>
      <div class="eyebrow">Project session</div>
      <div class="focus-body" id="focus-body"></div>
    </section>

    <footer class="foot">
      <div class="foot-total">
        <span class="eyebrow">Today</span>
        <b id="total">—</b>
      </div>
      <button type="button" id="open-dashboard" class="link-btn">Dashboard →</button>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
